name: deploy github pages site local

on:
  push:
    branches: [main] # Or your configured branch
  # Also runs on settings changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll # Only for Jekyll sites
        if: github.event_name == 'push'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
